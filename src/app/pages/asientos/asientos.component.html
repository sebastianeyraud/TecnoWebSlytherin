<div class="movie-container">
  <label>Pick a movie:</label>
  <select (change)="onCambioPelicula($event)" id="movie">
    <option *ngFor="let peli of peliculas" [value]="peli.precio">
      {{ peli.nombre }} (${{ peli.precio }})
    </option>
  </select>
</div>

<ul class="showcase">
  <li>
    <div class="seat"></div>
    <small>N/A</small>
  </li>
  <li>
    <div class="seat selected"></div>
    <small>Selected</small>
  </li>
  <li>
    <div class="seat occupied"></div>
    <small>Occupied</small>
  </li>
</ul>

<div class="container">
  <div class="screen"></div>

  <div class="row" *ngFor="let fila of filas">
    <div *ngFor="let asiento of fila.asientos"
         class="seat"
         [class.selected]="asiento.estado === 'seleccionado'"
         [class.occupied]="asiento.estado === 'ocupado'"
         (click)="toggleAsiento(asiento)"
         [title]="asiento.id">
    </div>
  </div>
</div>

<p class="text">
  You have selected <span id="count">{{ cantidadSeleccionada }}</span> seats for a price of $<span id="total">{{ totalPagar }}</span>.
</p>
