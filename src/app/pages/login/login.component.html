<div class="login-container">
  <div class="login-card">
    <h2 class="title">Iniciar sesión</h2>
    <hr>

    <form [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()" class="login-form">
      <div class="form-row">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" required>
          <div *ngIf="formularioLogin.get('email')?.touched && formularioLogin.get('email')?.invalid" style="color: red;">
            <span *ngIf="formularioLogin.get('email')?.errors?.['required']">El email es obligatorio.</span>
            <span *ngIf="formularioLogin.get('email')?.errors?.['email']">Email inválido.</span>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password" required>
        </div>
      </div>

      <p *ngIf="loginError" style="color: red; text-align: center; margin-bottom: 15px;">
        ¡Error! Email o Contraseña incorrectos.
      </p>

      <p class="info-text">
        ¿Aún no eres miembro? Únete ahora y empieza a disfrutar de ahorros, recompensas y mucho más en el cine.
      </p>

      <div class="register-link" style="text-align: center; margin-top: 15px;">
        <span>¿No tienes cuenta aún? </span>
        <a routerLink="/registro">Regístrate aquí</a>
      </div>

      <div class="action-row">
        <button type="submit" class="ingresar-btn">Ingresar</button>
      </div>
    </form>
  </div>
</div>
