<header class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <img src="/assets/logoamc.png" alt="AMC Theatres" />
    </div>
    <nav class="main-nav">
      <a href="#">Cartelera</a>
      <a href="#">Promociones</a>
    </nav>
  </div>
  <div class="topbar-right">
    <button class="header-btn">🛒</button> 

    <div style="color: white; margin-right: 15px;">
      Estado de Sesión: {{ isLoggedIn$ | async }}
    </div>

    

  <button class="header-btn">Membresía</button>

        <ng-container *ngIf="isLoggedIn$ | async; else notLoggedIn">
            <button class="header-btn" (click)="onLogout()">
                Cerrar sesión
            </button>
            <button class="header-btn" routerLink="/perfil">
                Perfil
            </button>
            <button class="header-btn" routerLink="/membresia">
                Membresia
            </button>
        </ng-container>

    <ng-template #notLoggedIn>
            <button class="header-btn" routerLink="/login">
                👤 Iniciar sesión
            </button>
            <button class="header-btn" routerLink="/registro">
                Crear cuenta
            </button>
        </ng-template>
    
  </div>
</header>
