<div *ngIf="visible" class="form-overlay">
  <div class="form-container">

    <h2>{{ pelicula ? 'Editar Película' : 'Agregar Película' }}</h2>

    <label>Título:</label>
    <input type="text" [(ngModel)]="formData.titulo">

    <label>Sinopsis:</label>
    <textarea [(ngModel)]="formData.sinopsis"></textarea>

    <label>Duración (min):</label>
    <input type="number" [(ngModel)]="formData.duracion_min">

    <label>Género:</label>
    <input type="text" [(ngModel)]="formData.genero">

    <label>Clasificación:</label>
    <input type="text" [(ngModel)]="formData.clasificacion">

    <label>Trailer (YouTube URL):</label>
    <input
      type="text"
      placeholder="https://www.youtube.com/watch?v=XXXX"
      [(ngModel)]="formData.trailer"
    >

    <button (click)="onSubmit()">Guardar</button>
    <button (click)="onClose()">Cancelar</button>

  </div>
</div>
