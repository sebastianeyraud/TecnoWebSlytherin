<section class="hero" *ngIf="peliculasHero.length > 0">
  <div
    class="hero-overlay"
    [style.background-image]="
      'url(' + (peliculasHero[currentIndex].banner || peliculasHero[currentIndex].poster_url) + ')'
    "
  >

    <div class="hero-content">
      <h1>{{ peliculasHero[currentIndex].titulo }}</h1>

      <p class="hero-subtitle">
        {{ peliculasHero[currentIndex].genero }} ·
        {{ peliculasHero[currentIndex].duracion_min }} minutos
      </p>

      <p class="hero-text">
        {{ peliculasHero[currentIndex].sinopsis }}
      </p>

      <div class="hero-cta">
        <button class="btn-primary">Comprar tickets</button>
        <p class="hero-date">
          {{ peliculasHero[currentIndex].estreno | date:'dd MMM yyyy' }}
        </p>
      </div>
    </div>

    <div class="hero-arrows">
      <button class="hero-arrow hero-arrow-prev" (click)="prev()">&lt;</button>
      <button class="hero-arrow hero-arrow-next" (click)="next()">&gt;</button>
    </div>

  </div>
</section>
