<section class="hero" *ngIf="peliculasHero.length > 0">

  <iframe
    class="hero-video"
    [src]="trailerUrl"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>

  <div class="hero-overlay">
    <div class="hero-content">
      <h1>{{ peliculasHero[currentIndex].titulo }}</h1>
      <p class="hero-subtitle">
        {{ peliculasHero[currentIndex].genero }} ·
        {{ peliculasHero[currentIndex].duracion_min }} min
      </p>
    </div>

    <div class="hero-arrows">
      <button class="hero-arrow" (click)="prev()">❮</button>
      <button class="hero-arrow" (click)="next()">❯</button>
    </div>
  </div>

</section>
